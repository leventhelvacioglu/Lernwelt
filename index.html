<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6c4bd9"><link rel="manifest" href="manifest.webmanifest"><title>Lernwelt</title><style>
:root{--p:#6c4bd9;--b:#3454d1;--bg:#f5f7ff;--card:#fff;--txt:#24324a;--ok:#1f9d61;--warn:#f39c34}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(150deg,#eef2ff,#fff6ec);color:var(--txt)}header{padding:18px 16px;background:linear-gradient(120deg,var(--p),var(--b));color:white;position:sticky;top:0;z-index:2}header h1{margin:0;font-size:22px}.wrap{max-width:980px;margin:auto;padding:16px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tabs button,.btn{border:0;border-radius:14px;padding:11px 14px;font-weight:700;cursor:pointer}.tabs button{background:#e7e9ff;color:#3d3a7c;white-space:nowrap}.tabs button.active,.btn{background:var(--p);color:#fff}.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 7px 24px #5360a51a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.day{border:2px solid #e8e9f7}.day.done{border-color:#40b87c;background:#f1fff7}.pill{display:inline-block;border-radius:99px;padding:5px 10px;background:#eef2ff;font-size:12px;font-weight:700}.progress{height:14px;background:#e8e9f3;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:linear-gradient(90deg,#47c783,#3454d1)}.question{padding:12px 0;border-top:1px solid #eee}.option{display:block;width:100%;text-align:left;margin:7px 0;padding:11px;border:1px solid #dfe2f1;border-radius:12px;background:white}.option.correct{background:#dff7e8;border-color:#1f9d61}.option.wrong{background:#ffe5e5;border-color:#d54a4a}textarea,input[type=text]{width:100%;padding:11px;border:1px solid #ccd1e2;border-radius:12px;font-size:16px}.small{font-size:13px;color:#68728b}.weekTitle{display:flex;justify-content:space-between;gap:12px;align-items:center}.check{font-size:18px}.hidden{display:none}@media(max-width:520px){header h1{font-size:19px}.wrap{padding:10px}.card{padding:13px}}
</style></head><body><header><h1>📚 Topraks Deutsch-Welt</h1><div id="headline">4-Wochen-Programm • Lesen & Schreiben</div></header><main class="wrap"><div class="tabs"><button class="active" data-tab="plan">📅 Plan</button><button data-tab="lernen">📖 Üben</button><button data-tab="fehler">✏️ Fehlerwörter</button><button data-tab="bericht">📊 Fortschritt</button></div><section id="plan"></section><section id="lernen" class="hidden"></section><section id="fehler" class="hidden"></section><section id="bericht" class="hidden"></section></main><script>
const DATA={"days": [{"week": 1, "day": "Mo", "focus": "Lesen & Ausgangscheck", "reading": "Wer/Was/Wo; 60–70 Wörter", "writing": "Schule, spielen; ie/i", "minutes": "25"}, {"week": 1, "day": "Di", "focus": "Schlüsselwörter", "reading": "Wichtige Wörter markieren", "writing": "Abschreiben mit Kontrolle", "minutes": "25"}, {"week": 1, "day": "Mi", "focus": "Genau lesen", "reading": "Richtig/Falsch begründen", "writing": "sch/ch, sp/st", "minutes": "25"}, {"week": 1, "day": "Do", "focus": "Reihenfolge", "reading": "Zuerst–dann–am Ende", "writing": "Satzbau", "minutes": "25"}, {"week": 1, "day": "Fr", "focus": "Wochencheck 1", "reading": "Neuer Kurztext, 5 Fragen", "writing": "10 Wörter + 2 Sätze", "minutes": "25"}, {"week": 2, "day": "Mo", "focus": "Informationen finden", "reading": "Wer/Was/Wann/Wo", "writing": "ei/ai", "minutes": "25"}, {"week": 2, "day": "Di", "focus": "Wiederholtes Lesen", "reading": "Text 3-mal lesen", "writing": "Doppelkonsonanten", "minutes": "25"}, {"week": 2, "day": "Mi", "focus": "Warum-Fragen", "reading": "Antwort mit weil", "writing": "Wortfamilien", "minutes": "25"}, {"week": 2, "day": "Do", "focus": "Fehler-Detektiv", "reading": "Unpassende Wörter finden", "writing": "Groß-/Kleinschreibung", "minutes": "25"}, {"week": 2, "day": "Fr", "focus": "Wochencheck 2", "reading": "80–100 Wörter, 6 Fragen", "writing": "10 Wörter + 3 Sätze", "minutes": "25"}, {"week": 3, "day": "Mo", "focus": "Sachtext verstehen", "reading": "Überschrift und Kernaussage", "writing": "ä/e, äu/eu", "minutes": "25"}, {"week": 3, "day": "Di", "focus": "Fragen verstehen", "reading": "Fragewort markieren", "writing": "Auslaut d/t, g/k, b/p", "minutes": "25"}, {"week": 3, "day": "Mi", "focus": "Zusammenfassen", "reading": "3 wichtige Sätze", "writing": "Nomen groß", "minutes": "25"}, {"week": 3, "day": "Do", "focus": "Textbelege", "reading": "Antwort im Text zeigen", "writing": "Satzzeichen", "minutes": "25"}, {"week": 3, "day": "Fr", "focus": "Wochencheck 3", "reading": "100–120 Wörter, 7 Fragen", "writing": "Kurzdiktat + Korrektur", "minutes": "30"}, {"week": 4, "day": "Mo", "focus": "Selbstständig lesen", "reading": "Plan: lesen–markieren–antworten", "writing": "Persönliche Fehlerwörter", "minutes": "25"}, {"week": 4, "day": "Di", "focus": "Text schreiben", "reading": "Bild-/Themenimpuls, 5 Sätze", "writing": "Satzanfänge", "minutes": "25"}, {"week": 4, "day": "Mi", "focus": "Überarbeiten", "reading": "Prüfliste anwenden", "writing": "Eigene Fehler korrigieren", "minutes": "25"}, {"week": 4, "day": "Do", "focus": "Generalprobe", "reading": "Gemischte Aufgaben", "writing": "Wiederholung", "minutes": "30"}, {"week": 4, "day": "Fr", "focus": "Abschlusscheck", "reading": "120–150 Wörter, 8 Fragen", "writing": "15 Wörter + 5 Sätze", "minutes": "30"}], "texts": {"1": {"title": "Der neue Pausenhof", "text": "Am Montag entdeckt Ben auf dem Pausenhof eine neue Spielekiste. Darin liegen Springseile, Bälle und Kreide. Ben nimmt einen blauen Ball. Seine Freundin Mia malt mit Kreide ein großes Hüpfspiel. Nach der Pause bringen beide alles zurück. Die Lehrerin freut sich, weil der Pausenhof ordentlich bleibt.", "questions": [{"q": "Wann entdeckt Ben die Spielekiste?", "options": ["Am Montag", "Am Freitag", "Am Sonntag"], "answer": 0}, {"q": "Was nimmt Ben?", "options": ["Kreide", "Einen blauen Ball", "Ein Buch"], "answer": 1}, {"q": "Was malt Mia?", "options": ["Ein Haus", "Ein Hüpfspiel", "Eine Sonne"], "answer": 1}, {"q": "Warum freut sich die Lehrerin?", "options": ["Weil alle laut sind", "Weil der Pausenhof ordentlich bleibt", "Weil es regnet"], "answer": 1}]}, "2": {"title": "Ein Ausflug in den Wald", "text": "Die Klasse 3b macht am Dienstag einen Ausflug in den Wald. Jedes Kind trägt einen kleinen Rucksack. Försterin Frau Kern zeigt Tierspuren im feuchten Boden. Toprak entdeckt einen Abdruck mit vier Zehen. Frau Kern erklärt, dass er von einem Fuchs sein kann. Später sammeln die Kinder Blätter, aber keine Pilze. Vor der Rückfahrt zählen sie gemeinsam alle Rucksäcke.", "questions": [{"q": "Wer begleitet die Klasse im Wald?", "options": ["Frau Kern", "Der Hausmeister", "Ein Arzt"], "answer": 0}, {"q": "Was entdeckt Toprak?", "options": ["Eine Feder", "Einen Abdruck", "Einen Pilz"], "answer": 1}, {"q": "Was dürfen die Kinder sammeln?", "options": ["Blätter", "Pilze", "Tiere"], "answer": 0}, {"q": "Warum zählen sie die Rucksäcke?", "options": ["Damit nichts vergessen wird", "Weil sie rechnen üben", "Weil es dunkel ist"], "answer": 0}]}, "3": {"title": "Warum Bienen wichtig sind", "text": "Bienen fliegen von Blüte zu Blüte und sammeln Nektar. Dabei bleibt Blütenstaub an ihrem Körper hängen. Wenn sie zur nächsten Blüte fliegen, übertragen sie einen Teil davon. So helfen Bienen vielen Pflanzen, Früchte und Samen zu bilden. Ohne diese Bestäubung gäbe es weniger Äpfel, Erdbeeren und andere Lebensmittel. Bienen brauchen blühende Pflanzen und sichere Plätze für ihre Nester.", "questions": [{"q": "Was sammeln Bienen?", "options": ["Nektar", "Steine", "Regenwasser"], "answer": 0}, {"q": "Was bleibt am Körper hängen?", "options": ["Sand", "Blütenstaub", "Gras"], "answer": 1}, {"q": "Wobei helfen Bienen?", "options": ["Bei der Bestäubung", "Beim Schneiden", "Beim Kochen"], "answer": 0}, {"q": "Was brauchen Bienen?", "options": ["Nur Wasser", "Blühende Pflanzen und Nistplätze", "Spielzeug"], "answer": 1}]}, "4": {"title": "Das verschwundene Heft", "text": "Am Donnerstag will Lara ihre Hausaufgaben abgeben. Doch das blaue Deutschheft ist nicht im Ranzen. Sie erinnert sich an den Nachmittag: Zuerst schrieb sie am Küchentisch, dann half sie ihrem Bruder beim Basteln. Lara ruft ihre Mutter an. Gemeinsam überlegen sie. Unter einem großen Bogen Bastelpapier liegt tatsächlich das Heft. Lara erklärt ihrer Lehrerin ehrlich, warum sie es erst nach der Pause bringen kann.", "questions": [{"q": "Welches Heft fehlt?", "options": ["Das Matheheft", "Das Deutschheft", "Das Musikheft"], "answer": 1}, {"q": "Wo schrieb Lara?", "options": ["Am Küchentisch", "Im Garten", "Im Bus"], "answer": 0}, {"q": "Wo liegt das Heft?", "options": ["Im Ranzen", "Unter Bastelpapier", "In der Schule"], "answer": 1}, {"q": "Wie reagiert Lara?", "options": ["Sie erfindet eine Ausrede", "Sie erklärt es ehrlich", "Sie sagt nichts"], "answer": 1}]}}}; const KEY='lernwelt-toprak-v22'; let state=JSON.parse(localStorage.getItem(KEY)||'{"done":{},"scores":{},"errors":[]}');
function save(){localStorage.setItem(KEY,JSON.stringify(state));renderAll()} function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderPlan(){let h='';for(let w=1;w<=4;w++){let ds=DATA.days.filter(d=>d.week===w),n=ds.filter((d,i)=>state.done[(w+'-'+i)]).length;h+=`<div class="card"><div class="weekTitle"><h2>Woche ${w}</h2><span class="pill">${n}/5 erledigt</span></div><div class="progress"><span style="width:${n*20}%"></span></div><div class="grid">`;ds.forEach((d,i)=>{let id=w+'-'+i,done=!!state.done[id];h+=`<div class="card day ${done?'done':''}"><b>${d.day} • ${esc(d.focus)}</b><p class="small">📖 ${esc(d.reading)}<br>✏️ ${esc(d.writing)}<br>⏱ ${d.minutes} Min.</p><label class="check"><input type="checkbox" ${done?'checked':''} onchange="toggleDay('${id}',this.checked)"> ${done?'Tamamlandı':'Als erledigt markieren'}</label></div>`});h+='</div></div>'}document.querySelector('#plan').innerHTML=h}
function toggleDay(id,v){state.done[id]=v;save()}
function renderLearn(){let h='<div class="card"><h2>Haftalık okuma ve anlama</h2><p>Önce metni iki kez oku. Sonra soruları çöz. Sistem doğru cevapların seçeneklerde bulunduğunu sabit soru setleriyle garanti eder.</p></div>';for(let w=1;w<=4;w++){let t=DATA.texts[w];h+=`<div class="card"><span class="pill">Woche ${w}</span><h2>${esc(t.title)}</h2><p>${esc(t.text)}</p>`;t.questions.forEach((q,qi)=>{h+=`<div class="question"><b>${qi+1}. ${esc(q.q)}</b>`;q.options.forEach((o,oi)=>h+=`<button class="option" id="o-${w}-${qi}-${oi}" onclick="answer(${w},${qi},${oi})">${esc(o)}</button>`);h+='</div>'});h+=`<p><b>Bu haftanın puanı:</b> <span id="score-${w}">${state.scores[w]??'henüz tamamlanmadı'}</span></p></div>`}document.querySelector('#lernen').innerHTML=h}
let temp={};function answer(w,q,a){let item=DATA.texts[w].questions[q];temp[w]=temp[w]||{};temp[w][q]=a;item.options.forEach((_,i)=>{let el=document.querySelector('#o-'+w+'-'+q+'-'+i);el.classList.remove('correct','wrong');if(i===item.answer)el.classList.add('correct');else if(i===a)el.classList.add('wrong')});if(Object.keys(temp[w]).length===itemCount(w)){let score=Object.entries(temp[w]).filter(([qi,a])=>DATA.texts[w].questions[qi].answer===a).length;state.scores[w]=score+'/'+itemCount(w);save()}}
function itemCount(w){return DATA.texts[w].questions.length}
function renderErrors(){let rows=state.errors.map((e,i)=>`<div class="card"><b>${esc(e.wrong)} → ${esc(e.right)}</b><div class="small">${esc(e.rule||'')}</div><button class="btn" onclick="delErr(${i})">Sil</button></div>`).join('');document.querySelector('#fehler').innerHTML=`<div class="card"><h2>Fehlerwörter</h2><label>Yanlış yazım<input id="ew" type="text"></label><label>Doğru yazım<input id="er" type="text"></label><label>Kural / hatırlatma<input id="ek" type="text"></label><p><button class="btn" onclick="addErr()">Kelimeyi ekle</button></p></div>${rows||'<div class="card">Henüz hata kelimesi eklenmedi.</div>'}`}
function addErr(){let w=document.querySelector('#ew').value.trim(),r=document.querySelector('#er').value.trim(),k=document.querySelector('#ek').value.trim();if(!w||!r)return alert('Lütfen yanlış ve doğru yazımı girin.');state.errors.push({wrong:w,right:r,rule:k});save()}function delErr(i){state.errors.splice(i,1);save()}
function renderReport(){let done=Object.values(state.done).filter(Boolean).length;let scores=Object.values(state.scores);document.querySelector('#bericht').innerHTML=`<div class="grid"><div class="card"><h2>${done}/20</h2><p>tamamlanan gün</p><div class="progress"><span style="width:${done*5}%"></span></div></div><div class="card"><h2>${scores.length}/4</h2><p>tamamlanan haftalık test</p></div><div class="card"><h2>${state.errors.length}</h2><p>Fehlerwörter listesinde</p></div></div><div class="card"><h2>Eksiklere çalışma</h2><p>${done<20?'Tamamlanmayan günler Plan bölümünde beyaz kart olarak görünür. Önce en eski eksik günü tamamlayın.':'Tüm günler tamamlandı.'}</p><p>${scores.length<4?'Eksik haftalık testleri Üben bölümünden tamamlayın.':'Tüm haftalık testler tamamlandı.'}</p><button class="btn" onclick="if(confirm('Tüm ilerleme silinsin mi?')){localStorage.removeItem(KEY);location.reload()}">İlerlemeyi sıfırla</button></div>`}
function renderAll(){renderPlan();renderLearn();renderErrors();renderReport()}document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('main section').forEach(s=>s.classList.add('hidden'));document.querySelector('#'+b.dataset.tab).classList.remove('hidden')}));if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');renderAll();
</script></body></html>
