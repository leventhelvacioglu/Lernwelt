se(localStorage.getItem(KEY))||{}}catch(e){state={}}state.answers=state.answers||{};state.done=state.done||{};let selectedDay=0;const $=s=>document.querySelector(s);function persist(){localStorage.setItem(KEY,JSON.stringify(state))}function answered(day){return Object.keys(state.answers[day]||{}).length}function score(day){return DATA[day].questions.reduce((n,q,i)=>n+((state.answers[day]||{})[i]===q.answer?1:0),0)}function dayTitle(i){let d=DATA[i];return `Woche ${d.week} • ${d.weekday}`}function renderPlan(){let h='<div class="card"><h2>Dein 4-Wochen-Plan</h2><p>Jeden Schultag eine Übung. Schreiben und Diktat macht ihr gemeinsam auf Papier.</p></div>';for(let w=1;w<=4;w++){let done=DATA.map((d,i)=>({d,i})).filter(x=>x.d.week===w&&state.done[x.i]).length;h+=`<div class="card"><h2>Woche ${w} <span class="pill">${done}/5 fertig</span></h2><div class="bar"><span style="width:${done*20}%"></span></div><div class="grid">`;for(let i=(w-1)*5;i<w*5;i++){let d=DATA[i],complete=!!state.done[i];h+=`<div class="card day ${complete?'done':''}"><b>${d.weekday} • ${d.title}</b><p class="muted">15 Auswahlfragen: Lesen, Rechtschreibung, Fehler finden und Satzverständnis.</p><p>${answered(i)}/15 beantwortet • ${score(i)}/15 richtig</p><button class="action" data-open="${i}">${complete?'Wiederholen':'Üben'}</button><p><label><input type="checkbox" data-check="${i}" ${complete?'checked':''}> Papierarbeit auch erledigt / Tag fertig</label></p></div>`}h+='</div></div>'}$('#plan').innerHTML=h;document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{selectedDay=+b.dataset.open;switchTab('uebungen')});document.querySelectorAll('[data-check]').forEach(b=>b.onchange=()=>{state.done[b.dataset.check]=b.checked;persist();renderAll()})}
function renderExercise(){let d=DATA[selectedDay],ans=state.answers[selectedDay]||{},types=['Lesen & Verstehen','Rechtschreibung','Fehler-Detektiv','Satz-Meister'];let h=`<div class="card"><h2>${dayTitle(selectedDay)}</h2><label>Tag auswählen: <select id="chooseDay">${DATA.map((x,i)=>`<option value="${i}" ${i===selectedDay?'selected':''}>W${x.week} ${x.weekday}</option>`).join('')}</select></label><p class="muted">${answered(selectedDay)}/15 beantwortet • ${score(selectedDay)}/15 richtig</p><h3>${d.textTitle}</h3><p>${d.text}</p><div class="notice">Lies den Text aufmerksam. Tippe jeweils auf eine Antwort. Bei Fehler-Detektiv: Wähle das FALSCH geschriebene Wort.</div></div>`;for(let type of types){h+=`<div class="card"><h2>${type}</h2>`;d.questions.forEach((q,i)=>{if(q.type!==type)return;h+=`<div class="q"><b>${i+1}. ${q.q}</b>`;q.options.forEach((o,j)=>{let cl=ans[i]===j?'selected':'';if(ans[i]!==undefined){if(j===q.answer)cl='correct';else if(j===ans[i])cl='wrong'}h+=`<button class="opt ${cl}" data-q="${i}" data-o="${j}" aria-pressed="${ans[i]===j}">${o}</button>`});h+='</div>'});h+='</div>'}h+=`<div class="card"><b>Ergebnis: ${score(selectedDay)} / 15</b><p>Yanlış soruları tekrar seçerek düzeltebilirsin. Kağıt çalışması bitince Plan bölümünden günü tamamlandı olarak işaretle.</p><button class="action" id="back">Zum Plan</button></div>`;$('#uebungen').innerHTML=h;$('#chooseDay').onchange=e=>{selectedDay=+e.target.value;renderExercise()};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{let q=+b.dataset.q,o=+b.dataset.o;state.answers[selectedDay]=state.answers[selectedDay]||{};state.answers[selectedDay][q]=o;persist();renderExercise()});$('#back').onclick=()=>switchTab('plan')}
function renderErrors(){let h='<div class="card"><h2>🔎 Fehler-Detektiv</h2><p>Kein Freitext: Tippe auf das falsch geschriebene Wort. Die Aufgaben sind auch in jedem Tagesprogramm enthalten.</p></div>';for(let w=1;w<=4;w++){let i=(w-1)*5,d=DATA[i];h+=`<div class="card"><h3>Woche ${w}</h3>`;d.questions.forEach((q,qi)=>{if(q.type!=='Fehler-Detektiv')return;let id='e'+w+'-'+qi,sel=(state.answers[id]||{})[0];h+=`<div class="q"><b>${q.q}</b>`;q.options.forEach((o,j)=>{let cl=sel===undefined?'':j===q.answer?'correct':sel===j?'wrong':'';h+=`<button class="opt ${cl}" data-error="${id}" data-option="${j}">${o}</button>`});h+='</div>'});h+='</div>'}$('#fehler').innerHTML=h;document.querySelectorAll('[data-error]').forEach(b=>b.onclick=()=>{let id=b.dataset.error,j=+b.dataset.option;state.answers[id]={0:j};persist();renderErrors();renderReport()})}
function renderReport(){let done=Object.values(state.done).filter(Boolean).length,wrong={};for(let i=0;i<20;i++){let a=state.answers[i]||{};DATA[i].questions.forEach((q,j)=>{if(a[j]!==undefined&&a[j]!==q.answer){wrong[q.type]=(wrong[q.type]||0)+1}})}let todo=DATA.map((d,i)=>({d,i})).filter(x=>!state.done[x.i]);let h=`<div class="card"><h2>Fortschritt</h2><h3>${done}/20 Tage erledigt</h3><div class="bar"><span style="width:${done*5}%"></span></div><p>Beantwortete Aufgaben und falsche Antworten werden auf diesem Gerät gespeichert.</p></div><div class="card"><h2>Häufige Fehler</h2>`;h+=Object.keys(wrong).length?Object.entries(wrong).map(([k,n])=>`<p>${k}: ${n} aktuell falsch beantwortete Fragen</p>`).join(''):'<p>Noch keine Fehler erfasst.</p>';h+='</div><div class="card"><h2>Noch offen</h2>';h+=todo.length?todo.map(x=>`<p>☐ Woche ${x.d.week} • ${x.d.weekday}</p>`).join(''):'<p>Alle 20 Tage erledigt!</p>';h+='</div><div class="card"><button class="action" id="reset">Fortschritt zurücksetzen</button></div>';$('#bericht').innerHTML=h;$('#reset').onclick=()=>{if(confirm('Alle gespeicherten Antworten und Fortschritte löschen?')){state={answers:{},done:{}};persist();renderAll()}}}
function renderAll(){renderPlan();renderExercise();renderErrors();renderReport()}function switchTab(tab){document.querySelectorAll('main section').forEach(s=>s.classList.toggle('hidden',s.id!==tab));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='uebungen')renderExercise();window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');renderAll();</script></body></html>
