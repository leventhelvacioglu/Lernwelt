<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5b5bd6"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><title>Lernwelt</title><style>
:root{--p:#5b5bd6;--m:#238c6c;--d:#d85b43;--bg:#f4f5ff;--card:#fff;--text:#202039;--line:#ddddef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:900px;margin:auto;padding:22px}.head,.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.head{margin-bottom:20px}.brand{font-size:30px;font-weight:900}.pill,.back{border:1px solid var(--line);background:#fff;border-radius:16px;padding:12px 16px;font-weight:800}.screen{display:none}.active{display:block}.hero{background:linear-gradient(135deg,#5b5bd6,#9368dd);color:#fff;padding:28px;border-radius:28px;margin-bottom:18px}.hero h1{font-size:44px;margin:0 0 8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.btn,.card{border:1px solid var(--line);background:var(--card);border-radius:24px;padding:22px;text-align:left;box-shadow:0 10px 28px #3332}.btn{min-height:140px;font-size:20px}.btn strong{display:block;font-size:25px;margin:8px 0}.subject{color:white;border:0}.math{background:linear-gradient(135deg,#238c6c,#49b996)}.german{background:linear-gradient(135deg,#d85b43,#f08a67)}.icon{font-size:42px}.title{font-size:28px;font-weight:900}.top{margin-bottom:20px;justify-content:flex-start}.question{text-align:center;font-size:42px;font-weight:900;margin:28px 0}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.answer{min-height:78px;border:2px solid var(--line);background:#fff;border-radius:20px;font-size:24px;font-weight:800}.correct{background:#dff8ed;border-color:#16845f;color:#16845f}.wrong{background:#ffe5e5;border-color:#c44545;color:#c44545}.feedback{text-align:center;min-height:60px;font-size:21px;font-weight:800;padding:16px}.next{width:100%;border:0;border-radius:18px;background:var(--p);color:#fff;padding:17px;font-size:19px;font-weight:900}.next:disabled{opacity:.35}.progress{height:12px;background:#e0e1ef;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--p)}.center{text-align:center}.stats{display:grid;gap:14px}@media(max-width:620px){.grid,.answers{grid-template-columns:1fr}.hero h1{font-size:34px}.question{font-size:34px}.app{padding:15px}}
</style></head><body><main class="app"><header class="head"><div class="brand">🚀 Lernwelt</div><div class="pill" id="points">⭐ 0</div></header>
<section id="home" class="screen active"><div class="hero"><h1>Hallo! 👋</h1><p>Wer möchte heute lernen?</p></div><div class="grid"><button class="btn" data-profile="Mavi"><span class="icon">👧</span><strong>Mavi</strong>3. Klasse</button><button class="btn" data-profile="Toprak"><span class="icon">👦</span><strong>Toprak</strong>3. Klasse</button></div><p class="center"><button class="back" id="parents">Elternbereich</button></p></section>
<section id="subjects" class="screen"><div class="top"><button class="back" data-go="home">← Zurück</button><div class="title" id="hello"></div></div><div class="grid"><button class="btn subject math" data-subject="Mathematik"><span class="icon">🔢</span><strong>Mathematik</strong>Rechnen, Einmaleins, Division und Uhrzeit</button><button class="btn subject german" data-subject="Deutsch"><span class="icon">📚</span><strong>Deutsch</strong>Artikel, Wortarten, Rechtschreibung, Satzbau und Lesen</button></div></section>
<section id="topics" class="screen"><div class="top"><button class="back" data-go="subjects">← Zurück</button><div class="title" id="subjectTitle"></div></div><div class="grid" id="topicGrid"></div></section>
<section id="quiz" class="screen"><div class="top"><button class="back" data-go="topics">× Beenden</button><div class="title" id="quizTitle"></div></div><div class="card"><div id="counter"></div><div class="progress"><span id="bar"></span></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next" disabled>Weiter</button></div></section>
<section id="result" class="screen"><div class="card center"><div style="font-size:72px">🏆</div><h1>Gut gemacht, <span id="rname"></span>!</h1><p id="rtext"></p><button class="next" data-go="subjects">Noch eine Runde</button></div></section>
<section id="parent" class="screen"><div class="top"><button class="back" data-go="home">← Zurück</button><div class="title">Elternbereich</div></div><div class="stats" id="stats"></div></section>
</main><script>
(()=>{const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>a.sort(()=>Math.random()-.5);const state={profile:'',subject:'',topic:'',i:0,correct:0,questions:[],locked:false};const store=JSON.parse(localStorage.getItem('lernwelt-v11')||'{"Mavi":{"points":0,"done":0,"correct":0},"Toprak":{"points":0,"done":0,"correct":0}}');const save=()=>localStorage.setItem('lernwelt-v11',JSON.stringify(store));function show(id){$$('.screen').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active');$('#points').textContent='⭐ '+(state.profile?store[state.profile].points:store.Mavi.points+store.Toprak.points)}
// FIX: the correct answer is inserted only after three wrong choices are selected, so it can never be sliced out.
function choices(answer,pool){answer=String(answer);const wrong=shuffle([...new Set(pool.map(String).filter(x=>x!==answer))]).slice(0,3);return shuffle([answer,...wrong])}
function mathQ(t){let a,b,ans,q,p;if(t==='Plus & Minus'){a=rnd(20,99);b=rnd(5,40);if(Math.random()<.5){ans=a+b;q=`${a} + ${b} = ?`}else{if(b>a)[a,b]=[b,a];ans=a-b;q=`${a} − ${b} = ?`}p=[ans+1,Math.max(0,ans-1),ans+10,Math.max(0,ans-10)]}else if(t==='Einmaleins'){a=rnd(2,10);b=rnd(2,10);ans=a*b;q=`${a} × ${b} = ?`;p=[a*(b+1),a*Math.max(1,b-1),ans+a,Math.max(1,ans-a)]}else if(t==='Division'){b=rnd(2,10);ans=rnd(2,10);a=b*ans;q=`${a} ÷ ${b} = ?`;p=[ans+1,Math.max(1,ans-1),ans+2,Math.max(1,ans-2)]}else{a=rnd(1,12);b=[0,15,30,45][rnd(0,3)];let next=a===12?1:a+1;ans=b===0?`${a}:00 Uhr`:b===15?`Viertel nach ${a}`:b===30?`Halb ${next}`:`Viertel vor ${next}`;q=`Wie sagt man ${a}:${String(b).padStart(2,'0')} Uhr?`;p=[`${a}:30 Uhr`,`Viertel nach ${next}`,`Halb ${a}`,`Viertel vor ${a}`]}return{q,ans:String(ans),opts:choices(ans,p)}}
const G={Artikel:[['___ Apfel','der',['die','das','den']],['___ Sonne','die',['der','das','den']],['___ Kind','das',['der','die','dem']],['___ Schule','die',['der','das','den']],['___ Haus','das',['der','die','den']]],Wortarten:[['Welches Wort ist ein Verb?','laufen',['schnell','Haus','blau']],['Welches Wort ist ein Nomen?','Schule',['lernen','schön','laut']],['Welches Wort ist ein Adjektiv?','freundlich',['spielen','Hund','Garten']],['Welches Wort ist ein Verb?','schreiben',['Heft','klein','rot']]],Rechtschreibung:[['Welches Wort ist richtig?','Fahrrad',['Farrad','Fahrad','Farhrad']],['Welches Wort ist richtig?','Schmetterling',['Schmeterling','Schmetterlling','Schmeterlling']],['Welches Wort ist richtig?','Frühstück',['Früstük','Frühstuck','Früschtück']],['Welches Wort ist richtig?','Fußball',['Fusball','Fußbal','Fussbal']]],Satzbau:[['Ordne: spielt / Mavi / draußen','Mavi spielt draußen.',['Spielt Mavi draußen.','Draußen Mavi spielt.','Mavi draußen spielt.']],['Ordne: liest / Toprak / ein Buch','Toprak liest ein Buch.',['Liest Toprak ein Buch.','Ein Buch Toprak liest.','Toprak ein liest Buch.']],['Was gehört ans Satzende? „Kommst du mit__“','?',['.','!',',']]],Lesen:[['„Lina hat drei rote Äpfel.“ Wie viele Äpfel hat Lina?','drei',['zwei','vier','fünf']],['„Der Hund schläft unter dem Tisch.“ Wo schläft der Hund?','unter dem Tisch',['auf dem Sofa','im Garten','neben der Tür']],['„Am Montag fährt Ben mit dem Bus zur Schule.“ Wann fährt Ben?','am Montag',['am Dienstag','am Freitag','am Sonntag']]]};function germanQ(t){let r=G[t][rnd(0,G[t].length-1)];return{q:r[0],ans:r[1],opts:shuffle([r[1],...r[2]])}}
const topics={Mathematik:[['Plus & Minus','➕'],['Einmaleins','✖️'],['Division','➗'],['Uhrzeit','🕐']],Deutsch:[['Artikel','🔤'],['Wortarten','🧩'],['Rechtschreibung','✍️'],['Satzbau','💬'],['Lesen','📖']]};$$('[data-profile]').forEach(b=>b.onclick=()=>{state.profile=b.dataset.profile;$('#hello').textContent='Hallo '+state.profile+'!';show('subjects')});$$('[data-subject]').forEach(b=>b.onclick=()=>{state.subject=b.dataset.subject;$('#subjectTitle').textContent=state.subject;$('#topicGrid').innerHTML='';topics[state.subject].forEach(([n,e])=>{let x=document.createElement('button');x.className='btn';x.innerHTML=`<span class="icon">${e}</span><strong>${n}</strong>5 Aufgaben`;x.onclick=()=>start(n);$('#topicGrid').appendChild(x)});show('topics')});function start(t){Object.assign(state,{topic:t,i:0,correct:0,questions:[]});for(let j=0;j<5;j++)state.questions.push(state.subject==='Mathematik'?mathQ(t):germanQ(t));$('#quizTitle').textContent=t;render();show('quiz')}function render(){state.locked=false;let x=state.questions[state.i];$('#counter').textContent=`Aufgabe ${state.i+1} von 5`;$('#bar').style.width=`${state.i*20}%`;$('#question').textContent=x.q;$('#feedback').textContent='';$('#next').disabled=true;$('#answers').innerHTML='';x.opts.forEach(o=>{let b=document.createElement('button');b.className='answer';b.textContent=o;b.onclick=()=>answer(b,o,x.ans);$('#answers').appendChild(b)})}function answer(btn,v,a){if(state.locked)return;state.locked=true;store[state.profile].done++;if(v===a){btn.classList.add('correct');state.correct++;store[state.profile].correct++;store[state.profile].points+=10;$('#feedback').textContent='✅ Super! +10 Punkte'}else{btn.classList.add('wrong');$$('.answer').find(x=>x.textContent===a).classList.add('correct');$('#feedback').textContent='💡 Richtig ist: '+a}save();show('quiz');$('#next').disabled=false}$('#next').onclick=()=>{if(++state.i<5)render();else{$('#rname').textContent=state.profile;$('#rtext').textContent=`${state.correct} von 5 richtig. ${state.correct*10} Punkte gesammelt.`;show('result')}};$$('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));$('#parents').onclick=()=>{$('#stats').innerHTML='';['Mavi','Toprak'].forEach(n=>{let d=store[n],p=d.done?Math.round(d.correct/d.done*100):0;$('#stats').innerHTML+=`<div class="card"><h2>${n} · ⭐ ${d.points}</h2><p>${d.done} Aufgaben · ${p}% richtig</p></div>`});show('parent')};if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{});show('home')})();
</script></body></html>
