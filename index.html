<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#5b5bd6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lernwelt">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Mavi & Toprak Lernwelt</title>
  <style>
    :root{--bg:#f5f6ff;--card:#fff;--ink:#202039;--muted:#666781;--primary:#5b5bd6;--primary2:#7777ea;--math:#2c9b78;--german:#e36b50;--good:#16845f;--bad:#c44545;--line:#e5e5f2;--shadow:0 12px 35px rgba(51,51,102,.10)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(160deg,#f8f8ff,#eef5ff)}
    button,input{font:inherit} button{cursor:pointer}
    .app{max-width:920px;margin:auto;min-height:100vh;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
    header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{font-size:clamp(22px,4vw,34px);font-weight:850;letter-spacing:-.7px}.pill{background:#fff;border:1px solid var(--line);border-radius:999px;padding:10px 14px;font-weight:750;box-shadow:var(--shadow)}
    .screen{display:none}.screen.active{display:block}.hero{background:linear-gradient(135deg,#5b5bd6,#8a66dc);color:white;border-radius:28px;padding:26px;box-shadow:var(--shadow);margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:clamp(28px,6vw,48px)}.hero p{margin:0;opacity:.9;font-size:18px}
    .profiles,.subjects,.answers,.stats{display:grid;gap:14px}.profiles{grid-template-columns:repeat(2,1fr)}.subjects{grid-template-columns:repeat(2,1fr)}
    .card,.profile,.subject,.topic{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow)}
    .profile,.subject,.topic{min-height:150px;text-align:left}.profile{display:flex;align-items:center;gap:16px}.avatar{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:38px;background:#eeeefe}.profile strong,.subject strong{display:block;font-size:24px;margin-bottom:5px}.small{color:var(--muted);font-size:15px}.subject{color:#fff;border:0}.subject.math{background:linear-gradient(135deg,#238c6c,#48b898)}.subject.german{background:linear-gradient(135deg,#d85b43,#ef8b68)}.subject .icon{font-size:48px;display:block;margin-bottom:14px}
    .topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}.back{border:0;background:#fff;border-radius:16px;padding:13px 17px;font-weight:800;box-shadow:var(--shadow)}.title{font-weight:850;font-size:27px;flex:1}
    .topics{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.topic{border:0}.topic .emoji{font-size:38px}.topic strong{display:block;font-size:20px;margin-top:10px}.topic:active,.profile:active,.subject:active,.answer:active{transform:scale(.98)}
    .quiz{max-width:700px;margin:auto}.progress{height:12px;background:#e1e2ef;border-radius:99px;overflow:hidden;margin:15px 0 24px}.progress span{display:block;height:100%;background:linear-gradient(90deg,#5b5bd6,#9e71e8);width:0;transition:.3s}.question{font-size:clamp(28px,7vw,48px);font-weight:850;text-align:center;margin:24px 0}.answers{grid-template-columns:repeat(2,1fr)}.answer{min-height:76px;border:2px solid var(--line);border-radius:20px;background:#fff;font-size:25px;font-weight:800}.answer.correct{background:#dff8ed;border-color:var(--good);color:var(--good)}.answer.wrong{background:#ffe5e5;border-color:var(--bad);color:var(--bad)}.feedback{text-align:center;min-height:62px;margin-top:18px;font-size:22px;font-weight:800}.next{width:100%;border:0;border-radius:18px;background:var(--primary);color:#fff;padding:17px;font-weight:850;font-size:19px}.next:disabled{opacity:.4}.result{text-align:center}.result .big{font-size:70px}.result h2{font-size:34px}.result button{margin-top:12px}
    .parent-link{margin-top:20px;text-align:center}.textbtn{border:0;background:transparent;color:var(--muted);text-decoration:underline;padding:12px}.stat{display:flex;justify-content:space-between;align-items:center}.bar{height:10px;background:#ececf4;border-radius:99px;overflow:hidden;margin-top:9px}.bar span{display:block;height:100%;background:var(--primary)}
    @media(max-width:600px){.profiles,.subjects,.topics,.answers{grid-template-columns:1fr}.profile,.subject{min-height:125px}.answer{min-height:68px}.hero{padding:22px}.app{padding-left:14px;padding-right:14px}}
    @media(prefers-color-scheme:dark){:root{--bg:#151523;--card:#222235;--ink:#f5f5ff;--muted:#b5b5cc;--line:#3a3a50;--shadow:none}html,body{background:#151523}.pill,.back,.answer{background:#222235}.avatar{background:#343451}}
  </style>
</head>
<body><main class="app" id="app">
<header><div class="brand">🚀 Lernwelt</div><div class="pill" id="scorePill">⭐ 0</div></header>
<section class="screen active" id="home">
  <div class="hero"><h1>Hallo! 👋</h1><p>Wer möchte heute lernen?</p></div>
  <div class="profiles">
    <button class="profile" data-profile="Mavi"><span class="avatar">👧</span><span><strong>Mavi</strong><span class="small">3. Klasse</span></span></button>
    <button class="profile" data-profile="Toprak"><span class="avatar">👦</span><span><strong>Toprak</strong><span class="small">3. Klasse</span></span></button>
  </div>
  <div class="parent-link"><button class="textbtn" id="parentBtn">Elternbereich</button></div>
</section>
<section class="screen" id="subjects"><div class="topbar"><button class="back" data-go="home">← Zurück</button><div class="title" id="helloName"></div></div>
 <div class="subjects"><button class="subject math" data-subject="Mathematik"><span class="icon">🔢</span><strong>Mathematik</strong><span>Rechnen, Einmaleins und Uhrzeit</span></button><button class="subject german" data-subject="Deutsch"><span class="icon">📚</span><strong>Deutsch</strong><span>Wörter, Grammatik und Lesen</span></button></div>
</section>
<section class="screen" id="topics"><div class="topbar"><button class="back" data-go="subjects">← Zurück</button><div class="title" id="subjectTitle"></div></div><div class="topics" id="topicGrid"></div></section>
<section class="screen" id="quiz"><div class="topbar"><button class="back" data-go="topics">× Beenden</button><div class="title" id="quizTitle"></div></div><div class="quiz card"><div id="counter"></div><div class="progress"><span id="progressBar"></span></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="nextBtn" disabled>Weiter</button></div></section>
<section class="screen" id="result"><div class="card result"><div class="big">🏆</div><h2>Gut gemacht, <span id="resultName"></span>!</h2><p id="resultText"></p><button class="next" data-go="subjects">Noch eine Runde</button></div></section>
<section class="screen" id="parent"><div class="topbar"><button class="back" data-go="home">← Zurück</button><div class="title">Elternbereich</div></div><div class="stats" id="stats"></div><p class="small" style="margin:18px 4px">Die Daten bleiben nur auf diesem Gerät gespeichert.</p></section>
</main>
<script>
(()=>{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const state={profile:'',subject:'',topic:'',i:0,correct:0,locked:false,questions:[]};
const store=JSON.parse(localStorage.getItem('lernwelt-v1')||'{"Mavi":{"points":0,"done":0,"correct":0},"Toprak":{"points":0,"done":0,"correct":0}}');
const save=()=>localStorage.setItem('lernwelt-v1',JSON.stringify(store));
function show(id){$$('.screen').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active');window.scrollTo(0,0);updateScore()}
function updateScore(){$('#scorePill').textContent='⭐ '+(state.profile?store[state.profile].points:store.Mavi.points+store.Toprak.points)}
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, shuffle=a=>a.sort(()=>Math.random()-.5);
function choices(answer,pool){let a=[answer,...pool.filter(x=>x!==answer)];return shuffle([...new Set(a)]).slice(0,4)}
function mathQ(topic){let a,b,ans,q,p=[];
 if(topic==='Plus & Minus'){a=rnd(20,99);b=rnd(5,Math.min(40,a));if(Math.random()<.5){ans=a+b;q=`${a} + ${b} = ?`}else{ans=a-b;q=`${a} − ${b} = ?`}p=[ans+1,ans-1,ans+10,ans-10]}
 if(topic==='Einmaleins'){a=rnd(2,10);b=rnd(2,10);ans=a*b;q=`${a} × ${b} = ?`;p=[a*(b+1),ans+a,Math.max(1,ans-b),ans+2]}
 if(topic==='Division'){b=rnd(2,10);ans=rnd(2,10);a=b*ans;q=`${a} ÷ ${b} = ?`;p=[ans+1,ans-1,b,ans+2]}
 if(topic==='Uhrzeit'){a=rnd(1,12);b=[0,15,30,45][rnd(0,3)];ans=b===0?`${a}:00 Uhr`:b===15?`Viertel nach ${a}`:b===30?`Halb ${a===12?1:a+1}`:`Viertel vor ${a===12?1:a+1}`;q=`Wie sagt man ${a}:${String(b).padStart(2,'0')} Uhr?`;p=[`${a}:30 Uhr`,`Viertel nach ${a===12?1:a+1}`,`Halb ${a}`,`Viertel vor ${a}`]}
 return {q,ans:String(ans),opts:choices(String(ans),p.map(String))}}
const germanBank={
 'Artikel':[['___ Apfel','der',['die','das','den']],['___ Sonne','die',['der','das','den']],['___ Kind','das',['der','die','dem']],['___ Schule','die',['der','das','den']],['___ Haus','das',['der','die','den']]],
 'Wortarten':[['Welches Wort ist ein Verb?','laufen',['schnell','Haus','blau']],['Welches Wort ist ein Nomen?','Schule',['lernen','schön','laut']],['Welches Wort ist ein Adjektiv?','freundlich',['spielen','Hund','Garten']],['Welches Wort ist ein Verb?','schreiben',['Heft','klein','rot']]],
 'Rechtschreibung':[['Welches Wort ist richtig?','Fahrrad',['Farrad','Fahrad','Farhrad']],['Welches Wort ist richtig?','Schmetterling',['Schmeterling','Schmetterlling','Schmeterlling']],['Welches Wort ist richtig?','Frühstück',['Früstük','Frühstuck','Früschtück']],['Welches Wort ist richtig?','Fußball',['Fusball','Fußbal','Fussbal']]],
 'Satzbau':[['Ordne den Satz: spielt / Mavi / draußen','Mavi spielt draußen.',['Spielt Mavi draußen.','Draußen Mavi spielt.','Mavi draußen spielt.']],['Ordne den Satz: liest / Toprak / ein Buch','Toprak liest ein Buch.',['Liest Toprak ein Buch.','Ein Buch Toprak liest.','Toprak ein liest Buch.']],['Was gehört ans Satzende? „Kommst du mit__“','?',['.','!',',']]],
 'Lesen':[['Lies: „Lina hat drei rote Äpfel.“ Wie viele Äpfel hat Lina?','drei',['zwei','vier','fünf']],['Lies: „Der Hund schläft unter dem Tisch.“ Wo schläft der Hund?','unter dem Tisch',['auf dem Sofa','im Garten','neben der Tür']],['Lies: „Am Montag fährt Ben mit dem Bus zur Schule.“ Wann fährt Ben?','am Montag',['am Dienstag','am Freitag','am Sonntag']]]
};
function germanQ(t){let row=germanBank[t][rnd(0,germanBank[t].length-1)];return{q:row[0],ans:row[1],opts:shuffle([row[1],...row[2]])}}
const topicData={Mathematik:[['Plus & Minus','➕'],['Einmaleins','✖️'],['Division','➗'],['Uhrzeit','🕐']],Deutsch:[['Artikel','🔤'],['Wortarten','🧩'],['Rechtschreibung','✍️'],['Satzbau','🗯️'],['Lesen','📖']]};
$$('[data-profile]').forEach(b=>b.onclick=()=>{state.profile=b.dataset.profile;$('#helloName').textContent='Hallo '+state.profile+'!';show('subjects')});
$$('[data-subject]').forEach(b=>b.onclick=()=>{state.subject=b.dataset.subject;$('#subjectTitle').textContent=state.subject;renderTopics();show('topics')});
function renderTopics(){$('#topicGrid').innerHTML='';topicData[state.subject].forEach(([name,emoji])=>{let b=document.createElement('button');b.className='topic';b.innerHTML=`<span class="emoji">${emoji}</span><strong>${name}</strong><span class="small">5 Aufgaben</span>`;b.onclick=()=>startQuiz(name);$('#topicGrid').appendChild(b)})}
function startQuiz(topic){Object.assign(state,{topic,i:0,correct:0,locked:false,questions:[]});for(let j=0;j<5;j++)state.questions.push(state.subject==='Mathematik'?mathQ(topic):germanQ(topic));$('#quizTitle').textContent=topic;renderQ();show('quiz')}
function renderQ(){state.locked=false;$('#feedback').textContent='';$('#nextBtn').disabled=true;$('#counter').textContent=`Aufgabe ${state.i+1} von 5`;$('#progressBar').style.width=`${state.i*20}%`;let x=state.questions[state.i];$('#question').textContent=x.q;$('#answers').innerHTML='';x.opts.forEach(o=>{let b=document.createElement('button');b.className='answer';b.textContent=o;b.onclick=()=>answer(b,o,x.ans);$('#answers').appendChild(b)})}
function answer(btn,val,ans){if(state.locked)return;state.locked=true;store[state.profile].done++;if(val===ans){btn.classList.add('correct');state.correct++;store[state.profile].correct++;store[state.profile].points+=10;$('#feedback').textContent='✅ Super! +10 Punkte'}else{btn.classList.add('wrong');$$('.answer').find(x=>x.textContent===ans)?.classList.add('correct');$('#feedback').textContent='💡 Fast! Richtig ist: '+ans}save();updateScore();$('#nextBtn').disabled=false}
$('#nextBtn').onclick=()=>{state.i++;if(state.i<5)renderQ();else finish()};
function finish(){$('#progressBar').style.width='100%';$('#resultName').textContent=state.profile;$('#resultText').textContent=`Du hast ${state.correct} von 5 Aufgaben richtig gelöst und ${state.correct*10} Punkte gesammelt.`;show('result')}
$$('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
$('#parentBtn').onclick=()=>{renderStats();show('parent')};
function renderStats(){$('#stats').innerHTML='';['Mavi','Toprak'].forEach(n=>{let d=store[n],pct=d.done?Math.round(d.correct/d.done*100):0;let el=document.createElement('div');el.className='card';el.innerHTML=`<div class="stat"><strong style="font-size:22px">${n}</strong><span>⭐ ${d.points}</span></div><p class="small">${d.done} Aufgaben · ${pct}% richtig</p><div class="bar"><span style="width:${pct}%"></span></div>`;$('#stats').appendChild(el)})}
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
updateScore();
})();
</script></body></html>
